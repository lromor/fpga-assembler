# Bazel downloader rules, wired in through --downloader_config in .bazelrc.
#
# GitHub release downloads intermittently return 5xx for minutes at a time.
# With a cold repository cache that takes CI down before a single target is
# analyzed (e.g. "no such package '@@apple_support+//crosstool': ... GET
# returned 504 Gateway Time-out"). Try GitHub first and fall back to Bazel's
# mirror, which carries the bazelbuild/* release archives. Every matching
# rewrite is attempted in order; archives the mirror lacks (abseil,
# googletest, ...) simply fall through to the GitHub attempt.
rewrite github.com/(.*) github.com/$1
rewrite github.com/(.*) mirror.bazel.build/github.com/$1
